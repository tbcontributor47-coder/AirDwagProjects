groups:
  - name: app_alerts
    rules:
      - alert: HighErrorRate
        # BUG: Syntax error in PromQL, 'http_requests_total' vector mismatch
        # BUG: Missing [5m] in rate()
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
