global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'backend-services'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    
    # BUG: Relabel config has syntax error 'replacment' instead of 'replacement'
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):9100'
        target_label: instance
        replacement: '${1}' 
