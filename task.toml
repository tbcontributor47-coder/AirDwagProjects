version = "1.0.0"

[task]
name = "infra-k8s-restart-loop"
description = "Debug and fix a Kubernetes deployment stuck in a CrashLoopBackOff"

[metadata]
author_name = "Antigravity"
author_email = "antigravity@google.com"
category = "system-administration"
difficulty = "medium"
tags = ["kubernetes", "docker", "debugging", "liveness-probe"]

[environment]
type = "dockerfile"
path = "environment/Dockerfile"
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 1024

[verifier]
timeout_sec = 300

[agent]
timeout_sec = 600

[scoring]
test_command = "bash /app/tests/test.sh"
oracle_command = "bash ../solution/solve.sh"
