id = "cobol-file-validation"
version = "1.0.0"
title = "COBOL EFT File Validation"
description = "Implement a robust data validator in COBOL for fixed-width EFT (Electronic Funds Transfer) files."

[metadata]
author_name = "TerminalBench Contributors"
author_email = "tbench@example.com"
difficulty = "hard"
category = "data-processing"
tags = ["cobol", "validation", "checksum", "data-processing"]

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier]
timeout_sec = 900

[agent]
timeout_sec = 900

[evaluation]
test_command = "bash ../tests/test.sh"
oracle_command = "bash ../solution/solve.sh"
