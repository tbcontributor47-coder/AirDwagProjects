id = "cobol-banking-engine"
version = "1.0.0"
title = "COBOL: Banking Transaction Reconciliation Engine"
description = "Fix a COBOL banking reconciliation engine that processes batch transaction files, performs balancing, and identifies high-value fraud patterns."

[metadata]
author_name = "TerminalBench Contributors"
author_email = "tbench@example.com"
difficulty = "hard"
category = "data-processing"
tags = ["cobol", "banking", "finance", "data-processing", "reconciliation"]

[environment]
type = "docker"
path = "environment"
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier]
timeout_sec = 900

[agent]
timeout_sec = 900

[evaluation]
test_command = "bash tests/test.sh"
oracle_command = "bash solution/solve.sh && bash tests/test.sh"
